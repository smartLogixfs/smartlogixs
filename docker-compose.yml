name: smartlogix

networks:
  web:
    name: smartlogix_web
  internal:
    name: smartlogix_internal
    internal: true

volumes:
  pg-inventario-data:
  pg-pedido-data:
  pg-envio-data:

services:
  # ===========================================================
  # Capa de entrada - Ingress Controller
  # ===========================================================
  traefik:
    image: traefik:v3.5
    container_name: smartlogix-traefik
    restart: unless-stopped
    command:
      - "--configFile=/etc/traefik/traefik.yml"
    ports:
      - "80:80"
      - "443:443"
      # Dashboard accesible via http://traefik.smartlogix.localhost
    volumes:
      - ./infra/traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./infra/traefik/dynamic:/etc/traefik/dynamic:ro
    networks:
      - web

  # ===========================================================
  # Capa de presentacion - Frontend React 19
  # ===========================================================
  frontend:
    build:
      context: ./frontend
    container_name: smartlogix-frontend
    restart: unless-stopped
    networks:
      - web
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=smartlogix_web"
      - "traefik.http.routers.frontend.rule=Host(`app.smartlogix.localhost`)"
      - "traefik.http.routers.frontend.entrypoints=web"
      - "traefik.http.services.frontend.loadbalancer.server.port=80"
      - "traefik.http.routers.frontend.middlewares=secure-headers@file"

  # ===========================================================
  # Capa de seguridad - API Gateway Krakend
  # ===========================================================
  apigateway:
    build:
      context: ./backend/microservices/apigateway
    container_name: smartlogix-apigateway
    restart: unless-stopped
    environment:
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      - bff
    networks:
      - web
      - internal
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=smartlogix_web"
      - "traefik.http.routers.api.rule=Host(`api.smartlogix.localhost`)"
      - "traefik.http.routers.api.entrypoints=web"
      - "traefik.http.services.api.loadbalancer.server.port=8080"
      - "traefik.http.routers.api.middlewares=secure-headers@file,rate-limit@file,cors-api@file"

  # ===========================================================
  # Capa de adaptacion - BFF Node.js 20
  # ===========================================================
  bff:
    build:
      context: ./backend/bff
    container_name: smartlogix-bff
    restart: unless-stopped
    environment:
      PORT: 3000
      MS_INVENTARIO_URL: http://ms-inventario:8080
      MS_PEDIDO_URL: http://ms-pedido:8080
      MS_ENVIO_URL: http://ms-envio:8080
    depends_on:
      - ms-inventario
      - ms-pedido
      - ms-envio
    networks:
      - internal
      - web
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=smartlogix_web"
      - "traefik.http.routers.bff.rule=Host(`bff.smartlogix.localhost`)"
      - "traefik.http.routers.bff.entrypoints=web"
      - "traefik.http.services.bff.loadbalancer.server.port=3000"

  # ===========================================================
  # Capa de negocio - Microservicios Spring Boot
  # ===========================================================
  ms-inventario:
    build:
      context: ./backend/microservices/ms-inventario
    container_name: smartlogix-ms-inventario
    restart: unless-stopped
    environment:
      SERVER_PORT: 8080
      SPRING_DATASOURCE_URL: jdbc:postgresql://db-inventario:5432/${POSTGRES_INVENTARIO_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_INVENTARIO_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_INVENTARIO_PASSWORD}
    depends_on:
      - db-inventario
    networks:
      - internal

  ms-pedido:
    build:
      context: ./backend/microservices/ms-pedido
    container_name: smartlogix-ms-pedido
    restart: unless-stopped
    environment:
      SERVER_PORT: 8080
      SPRING_DATASOURCE_URL: jdbc:postgresql://db-pedido:5432/${POSTGRES_PEDIDO_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_PEDIDO_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PEDIDO_PASSWORD}
      MS_INVENTARIO_URL: http://ms-inventario:8080
    depends_on:
      - db-pedido
    networks:
      - internal

  ms-envio:
    build:
      context: ./backend/microservices/ms-envio
    container_name: smartlogix-ms-envio
    restart: unless-stopped
    environment:
      SERVER_PORT: 8080
      SPRING_DATASOURCE_URL: jdbc:postgresql://db-envio:5432/${POSTGRES_ENVIO_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_ENVIO_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_ENVIO_PASSWORD}
    depends_on:
      - db-envio
    networks:
      - internal

  # ===========================================================
  # Capa de datos - PostgreSQL 16 (DB-per-service, red privada)
  # ===========================================================
  db-inventario:
    image: postgres:16-alpine
    container_name: smartlogix-db-inventario
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_INVENTARIO_DB}
      POSTGRES_USER: ${POSTGRES_INVENTARIO_USER}
      POSTGRES_PASSWORD: ${POSTGRES_INVENTARIO_PASSWORD}
    volumes:
      - pg-inventario-data:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_INVENTARIO_USER} -d ${POSTGRES_INVENTARIO_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  db-pedido:
    image: postgres:16-alpine
    container_name: smartlogix-db-pedido
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_PEDIDO_DB}
      POSTGRES_USER: ${POSTGRES_PEDIDO_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PEDIDO_PASSWORD}
    volumes:
      - pg-pedido-data:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_PEDIDO_USER} -d ${POSTGRES_PEDIDO_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  db-envio:
    image: postgres:16-alpine
    container_name: smartlogix-db-envio
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_ENVIO_DB}
      POSTGRES_USER: ${POSTGRES_ENVIO_USER}
      POSTGRES_PASSWORD: ${POSTGRES_ENVIO_PASSWORD}
    volumes:
      - pg-envio-data:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_ENVIO_USER} -d ${POSTGRES_ENVIO_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
