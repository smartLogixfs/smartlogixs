apiVersion: apps/v1
kind: Deployment
metadata:
  name: ms-shipping
  namespace: smartlogix
  labels:
    app.kubernetes.io/name: ms-shipping
    app.kubernetes.io/part-of: smartlogix
    app.kubernetes.io/component: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ms-shipping
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ms-shipping
        app.kubernetes.io/part-of: smartlogix
        app.kubernetes.io/component: backend
    spec:
      containers:
        - name: ms-shipping
          image: smartlogix/ms-shipping:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: POSTGRES_ENVIO_DB
              valueFrom:
                configMapKeyRef:
                  name: smartlogix-config
                  key: POSTGRES_ENVIO_DB
            - name: SERVER_PORT
              value: "8080"
            - name: SPRING_DATASOURCE_URL
              value: jdbc:postgresql://db-shipping:5432/$(POSTGRES_ENVIO_DB)
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                configMapKeyRef:
                  name: smartlogix-config
                  key: POSTGRES_ENVIO_USER
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: smartlogix-secret
                  key: POSTGRES_ENVIO_PASSWORD
          resources:
            requests:
              cpu: 100m
              memory: 384Mi
            limits:
              cpu: 1000m
              memory: 768Mi
