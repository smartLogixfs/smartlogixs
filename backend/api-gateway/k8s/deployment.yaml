apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: smartlogix
  labels:
    app.kubernetes.io/name: api-gateway
    app.kubernetes.io/part-of: smartlogix
    app.kubernetes.io/component: gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: api-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: api-gateway
        app.kubernetes.io/part-of: smartlogix
        app.kubernetes.io/component: gateway
    spec:
      containers:
        - name: api-gateway
          image: smartlogix/api-gateway:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: smartlogix-secret
                  key: JWT_SECRET
          volumeMounts:
            - name: krakend-config
              mountPath: /etc/krakend/krakend.json
              subPath: krakend.json
              readOnly: true
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 384Mi
      volumes:
        - name: krakend-config
          configMap:
            name: krakend-config
            items:
              - key: krakend.json
                path: krakend.json
