apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: smartlogix
resources:
  - deployment.yaml
  - service.yaml

# NOTA: el ConfigMap con krakend.json NO se genera aqui. kustomize bloquea leer
# archivos fuera del directorio del kustomization (../krakend.json), por lo que el
# configMapGenerator vive en ../kustomization.yaml (nivel del gateway), donde
# krakend.json es local. Para desplegar el gateway de forma independiente, usar:
#   kubectl apply -k backend/api-gateway
# (no  backend/api-gateway/k8s, que no incluye el ConfigMap).
