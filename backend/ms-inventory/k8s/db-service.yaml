apiVersion: v1
kind: Service
metadata:
  name: db-inventory
  namespace: smartlogix
  labels:
    app.kubernetes.io/name: db-inventory
    app.kubernetes.io/part-of: smartlogix
spec:
  type: ClusterIP
  clusterIP: None  # headless: necesario para el StatefulSet
  selector:
    app.kubernetes.io/name: db-inventory
  ports:
    - name: pg
      port: 5432
      targetPort: pg
