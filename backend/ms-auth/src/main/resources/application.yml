server:
  port: 8081

spring:
  application:
    name: ms-auth
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5444/auth_db}
    username: ${DB_USERNAME:auth_user}
    password: ${DB_PASSWORD:auth_pass}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health,info

security:
  jwt:
    issuer: ${JWT_ISSUER:http://localhost:8081}
    access-token-minutes: ${JWT_ACCESS_TOKEN_MINUTES:30}
    private-key-path: ${JWT_PRIVATE_KEY_PATH:../private_key.pem}
    public-key-path: ${JWT_PUBLIC_KEY_PATH:../public_key.pem}
