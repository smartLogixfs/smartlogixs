apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: db-auth
  namespace: smartlogix
  labels:
    app.kubernetes.io/name: db-auth
    app.kubernetes.io/part-of: smartlogix
    app.kubernetes.io/component: database
spec:
  serviceName: db-auth
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: db-auth
  template:
    metadata:
      labels:
        app.kubernetes.io/name: db-auth
        app.kubernetes.io/part-of: smartlogix
        app.kubernetes.io/component: database
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - name: pg
              containerPort: 5432
          env:
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: smartlogix-config
                  key: POSTGRES_AUTH_DB
            - name: POSTGRES_USER
              valueFrom:
                configMapKeyRef:
                  name: smartlogix-config
                  key: POSTGRES_AUTH_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: smartlogix-secret
                  key: POSTGRES_AUTH_PASSWORD
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 2Gi
