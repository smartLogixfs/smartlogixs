apiVersion: apps/v1
kind: Deployment
metadata:
  name: ms-auth
  namespace: smartlogix
  labels:
    app.kubernetes.io/name: ms-auth
    app.kubernetes.io/part-of: smartlogix
    app.kubernetes.io/component: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ms-auth
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ms-auth
        app.kubernetes.io/part-of: smartlogix
        app.kubernetes.io/component: backend
    spec:
      containers:
        - name: ms-auth
          image: smartlogix/ms-auth:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8081
          env:
            - name: SERVER_PORT
              value: "8081"
            - name: POSTGRES_AUTH_DB
              valueFrom:
                configMapKeyRef:
                  name: smartlogix-config
                  key: POSTGRES_AUTH_DB
            - name: DB_URL
              value: jdbc:postgresql://db-auth:5432/$(POSTGRES_AUTH_DB)
            - name: DB_USERNAME
              valueFrom:
                configMapKeyRef:
                  name: smartlogix-config
                  key: POSTGRES_AUTH_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: smartlogix-secret
                  key: POSTGRES_AUTH_PASSWORD
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: smartlogix-secret
                  key: JWT_SECRET
            - name: JWT_ISSUER
              valueFrom:
                configMapKeyRef:
                  name: smartlogix-config
                  key: JWT_ISSUER
            - name: JWT_PRIVATE_KEY_PATH
              value: /keys/private_key.pem
            - name: JWT_PUBLIC_KEY_PATH
              value: /keys/public_key.pem
          volumeMounts:
            - name: jwt-keys
              mountPath: /keys
              readOnly: true
          resources:
            requests:
              cpu: 100m
              memory: 384Mi
            limits:
              cpu: 1000m
              memory: 768Mi
      volumes:
        - name: jwt-keys
          secret:
            secretName: ms-auth-keys
            defaultMode: 0400
