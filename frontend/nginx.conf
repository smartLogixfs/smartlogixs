# Frontend SmartLogix - SPA React + proxy /api -> BFF
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Cache para assets estaticos (Vite genera hashes en el filename)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Las llamadas del SPA a /api se reenvian al BFF dentro de la red Docker.
    # En k8s la URL del BFF es el Service `bff` en el namespace smartlogix.
    location /api/ {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://bff:3000/;
    }

    # Documentacion agregada (Swagger UI del BFF) servida via mismo origen.
    location /docs {
        proxy_pass http://bff:3000/docs;
    }
    location /openapi.json {
        proxy_pass http://bff:3000/openapi.json;
    }

    # SPA fallback: cualquier ruta del router cliente sirve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
