apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: smartlogix
  labels:
    app.kubernetes.io/name: frontend
    app.kubernetes.io/part-of: smartlogix
    app.kubernetes.io/component: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: frontend
        app.kubernetes.io/part-of: smartlogix
        app.kubernetes.io/component: frontend
    spec:
      containers:
        - name: frontend
          image: smartlogix/frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 192Mi
