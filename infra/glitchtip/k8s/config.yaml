# Configuracion comun de GlitchTip. Para dev/demo local: la SECRET_KEY y la
# password de Postgres van en un Secret con valores de ejemplo; cambialas en
# un entorno real.
apiVersion: v1
kind: ConfigMap
metadata:
  name: glitchtip-config
  namespace: glitchtip
data:
  DATABASE_URL: postgres://glitchtip:glitchtip@glitchtip-db:5432/glitchtip
  REDIS_URL: redis://glitchtip-redis:6379/0
  PORT: "8000"
  GLITCHTIP_DOMAIN: http://localhost:8000
  ENABLE_OPEN_USER_REGISTRATION: "true"
  EMAIL_URL: consolemail://
  DEFAULT_FROM_EMAIL: glitchtip@smartlogix.localhost
  CELERY_WORKER_AUTOSCALE: "1,3"
---
apiVersion: v1
kind: Secret
metadata:
  name: glitchtip-secret
  namespace: glitchtip
type: Opaque
stringData:
  # Cambiar por una cadena larga aleatoria en un entorno real.
  SECRET_KEY: change-me-in-local-dev-please
  POSTGRES_PASSWORD: glitchtip
