# Traefik v3.5 - configuracion estatica
# https://doc.traefik.io/traefik/

global:
  checkNewVersion: false
  sendAnonymousUsage: false

api:
  dashboard: true
  insecure: false

log:
  level: INFO

accessLog: {}

entryPoints:
  web:
    address: ":80"
    # Para activar HTTPS automatico, descomentar redirection:
    # http:
    #   redirections:
    #     entryPoint:
    #       to: websecure
    #       scheme: https
  websecure:
    address: ":443"
  traefik:
    address: ":8080"

providers:
  # Provider File: routers definidos en infra/traefik/dynamic/
  # Se prefiere sobre el provider Docker porque evita problemas
  # de negociacion de API version con Docker Desktop Windows
  file:
    directory: /etc/traefik/dynamic
    watch: true

