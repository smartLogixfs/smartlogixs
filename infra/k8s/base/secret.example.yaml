# TEMPLATE - NO contiene credenciales reales.
#
# Para uso local/dev hay 2 opciones:
#
# Opcion A (recomendada): generar Secret desde el .env del repo
#   kubectl create namespace smartlogix --dry-run=client -o yaml | kubectl apply -f -
#   kubectl -n smartlogix create secret generic smartlogix-secret --from-env-file=../../.env
#
# Opcion B: copiar este archivo a secret.yaml y reemplazar los placeholders.
#   El archivo secret.yaml NO debe commitearse (esta en .gitignore).
#
# En produccion: usar SealedSecrets, External Secrets Operator o Vault.
apiVersion: v1
kind: Secret
metadata:
  name: smartlogix-secret
  namespace: smartlogix
  labels:
    app.kubernetes.io/part-of: smartlogix
type: Opaque
stringData:
  POSTGRES_INVENTARIO_PASSWORD: <REPLACE_ME>
  POSTGRES_PEDIDO_PASSWORD: <REPLACE_ME>
  POSTGRES_ENVIO_PASSWORD: <REPLACE_ME>
  POSTGRES_USUARIO_PASSWORD: <REPLACE_ME>
  POSTGRES_AUTH_PASSWORD: <REPLACE_ME>
  JWT_SECRET: <REPLACE_ME>
