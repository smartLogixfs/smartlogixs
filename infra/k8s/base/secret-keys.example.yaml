# Secret con las claves RSA usadas por ms-auth para firmar JWT (RS256) y exponer JWKS.
#
# El deployment de ms-auth (backend/ms-auth/k8s/deployment.yaml) monta este Secret
# en /app/keys/{private_key.pem,public_key.pem}.
#
# Crear desde los archivos del repo (preferido):
#   kubectl -n smartlogix create secret generic smartlogix-keys \
#     --from-file=private_key.pem=./private_key.pem \
#     --from-file=public_key.pem=./public_key.pem
#
# O copiar este archivo a secret-keys.yaml y pegar el contenido base64 de cada PEM:
#   base64 -w0 private_key.pem
#   base64 -w0 public_key.pem
#
# secret-keys.yaml NO se commitea (esta en .gitignore).
apiVersion: v1
kind: Secret
metadata:
  name: smartlogix-keys
  namespace: smartlogix
  labels:
    app.kubernetes.io/part-of: smartlogix
type: Opaque
data:
  private_key.pem: <BASE64_DE_private_key.pem>
  public_key.pem: <BASE64_DE_public_key.pem>
