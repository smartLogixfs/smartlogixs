# Orquestador raiz: levanta todo SmartLogix en k8s.
# Cada microservicio mantiene su propio kustomization.yaml dentro de su carpeta,
# por lo que tambien puede desplegarse de forma independiente:
#   kubectl apply -k ../../backend/ms-inventory/k8s
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: smartlogix
images:
  - name: smartlogix/api-gateway
    newTag: eh
  - name: smartlogix/bff
    newTag: eng-full
  - name: smartlogix/frontend
    newTag: json-en
  - name: smartlogix/ms-auth
    newTag: eh
  - name: smartlogix/ms-inventory
    newTag: eng-full
  - name: smartlogix/ms-order
    newTag: eng-full
  - name: smartlogix/ms-shipping
    newTag: eng-full
  - name: smartlogix/ms-user
    newTag: eng-full
resources:
  # 1) Recursos compartidos (namespace + ConfigMap)
  - base

  # 2) Capa de datos + backend - cada MS es autocontenido (incluye su Postgres)
  - ../../backend/ms-inventory/k8s
  - ../../backend/ms-order/k8s
  - ../../backend/ms-shipping/k8s
  - ../../backend/ms-user/k8s
  - ../../backend/ms-auth/k8s

  # 3) Capa de adaptacion + gateway + presentacion
  - ../../backend/bff/k8s
  - ../../backend/api-gateway      # nivel gateway: incluye k8s/ + ConfigMap de krakend.json
  - ../../frontend/k8s

  # 4) Ingress con Traefik (replica los middlewares del stack docker-compose).
  #    Alternativa nginx: comentar la linea de abajo y descomentar 'ingress.yaml'.
  #    Usar SOLO UNO.
  - ingress-traefik.yaml
  # - ingress.yaml   # nginx-ingress (requiere ingressClassName: nginx)
